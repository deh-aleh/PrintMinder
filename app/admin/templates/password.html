{% extends "base.html" %}
{% block title %}{{ _("Change password") }}{% endblock %}
{% block body %}
<form class="card login" method="post" action="/me/password" style="max-width:420px">
  <h1>{{ _("Change password") }}</h1>
  {% if forced %}<p class="muted">{{ _("Your current password is temporary: choose your own to continue.") }}</p>{% endif %}
  <input type="hidden" name="csrf_token" value="{{ csrf }}">
  <input type="password" name="current" placeholder="{{ _('Current password') }}" autocomplete="current-password" required>
  <input type="password" name="new" placeholder="{{ _('New password (min. 12 characters)') }}" autocomplete="new-password" required>
  <input type="password" name="confirm" placeholder="{{ _('Repeat the new password') }}" autocomplete="new-password" required>
  <button style="width:100%">{{ _("Change") }}</button>
</form>
{% endblock %}
