<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <title>PrintMinder</title>
  <!-- browser tab icon: ink tile with a light ring, readable on any tab colour -->
  <clipPath id="t"><path d="M226 0H798A226 226 0 0 1 1024 226V798A226 226 0 0 1 798 1024H300L0 724V226A226 226 0 0 1 226 0Z"/></clipPath>
  <path fill="#17181D" d="M226 0H798A226 226 0 0 1 1024 226V798A226 226 0 0 1 798 1024H300L0 724V226A226 226 0 0 1 226 0Z"/>
  <!-- thin light ring: the icon stays visible on dark and on light browser tabs -->
  <path clip-path="url(#t)" fill="none" stroke="#F4EFE6" stroke-width="56" d="M226 0H798A226 226 0 0 1 1024 226V798A226 226 0 0 1 798 1024H300L0 724V226A226 226 0 0 1 226 0Z"/>
  <!-- the tile is a sheet with a folded corner; the flap is the cut corner mirrored across the fold -->
  <path fill="#E0306E" d="M0 724L300 1024V724Z"/>
  <!-- the P has paper thickness: the same shape, shifted and darker -->
  <path fill="#B9AF9A" fill-rule="evenodd" transform="translate(24 24)" d="M282 190H542A200 200 0 0 1 542 590H432V790H282ZM432 340V440H542A50 50 0 0 0 542 340Z"/>
  <path fill="#F4EFE6" fill-rule="evenodd" d="M282 190H542A200 200 0 0 1 542 590H432V790H282ZM432 340V440H542A50 50 0 0 0 542 340Z"/>
</svg>
